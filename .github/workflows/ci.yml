name: CI (Build, Test, and Docs)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

# framework home 系 (MAKEFW_HOME など) と実行時パスは .vscode/.env.* を源泉とし、
# 各ジョブの Load app environment ステップで読み込む。ここには定義しない。
env:
  OPENCPPCOVERAGE_VERSION: "0.9.9.0"
  REPORTGENERATOR_VERSION: "5.4.3"
  WINFLEXBISON_VERSION: "2.5.25"
  WINFLEXBISON_SHA256: "8D324B62BE33604B2C45AD1DD34AB93D722534448F55A16CA7292DE32B6AC135"

jobs:
  build-and-test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os-name: ol8
            image: ghcr.io/hondarer/oracle-linux-container/oracle-linux-8-dev:latest
          - os-name: ol9
            image: ghcr.io/hondarer/oracle-linux-container/oracle-linux-9-dev:latest
          - os-name: ol10
            image: ghcr.io/hondarer/oracle-linux-container/oracle-linux-10-dev:latest
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        HOST_USER: user
        HOST_UID: 1001
        HOST_GID: 127
        TZ: Asia/Tokyo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check NBSP
        run: python3 bin/check-nbsp.py --force

      - name: Load app environment
        run: bash bin/load-app-env.sh --env-file .vscode/.env.linux --workspace "$GITHUB_WORKSPACE" --format github

      - name: Record make version
        run: make --version

      - name: Make build log directory
        run: mkdir -p logs

      - name: Build
        run: |
          set -o pipefail
          make 2>&1 | tee logs/linux-${{ matrix.os-name }}-build.log

      - name: Run tests
        run: |
          set -o pipefail
          make test 2>&1 | tee logs/linux-${{ matrix.os-name }}-test.log

      - name: Upload test results artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.os-name }}-test-results
          path: |
            app/**/results/
            logs/linux-${{ matrix.os-name }}-test.log
          if-no-files-found: warn

      - name: Upload build warnings
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.os-name }}-warns
          path: |
            app/app_env.warn
            app/c_cpp_properties.warn
            app/**/prod/**/*.warn
            app/**/test/**/*.warn
          if-no-files-found: ignore

      - name: Upload build logs
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.os-name }}-logs
          path: logs/linux-${{ matrix.os-name }}-build.log
          if-no-files-found: warn

  build-and-test-windows:
    runs-on: windows-2025-vs2026
    env:
      TZ: JST-9
      BISON: win_bison
      FLEX: win_flex
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check NBSP
        run: python3 bin/check-nbsp.py --force

      - name: Load app environment
        run: bash bin/load-app-env.sh --env-file .vscode/.env.windows --workspace '${{ github.workspace }}' --format github
        shell: bash

      - name: Install WinFlexBison
        run: |
          $ErrorActionPreference = "Stop"
          $archiveName = "win_flex_bison-$env:WINFLEXBISON_VERSION.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $installPath = Join-Path $env:RUNNER_TEMP "winflexbison-$env:WINFLEXBISON_VERSION"
          # see: https://github.com/lexxmark/winflexbison/releases/tag/v2.5.25
          $downloadUrl = "https://github.com/lexxmark/winflexbison/releases/download/v$env:WINFLEXBISON_VERSION/$archiveName"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash
          if ($actualHash -ne $env:WINFLEXBISON_SHA256) {
              throw "WinFlexBison SHA-256 mismatch: expected $env:WINFLEXBISON_SHA256, actual $actualHash"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $installPath -Force
          Add-Content -Path $env:GITHUB_PATH -Value $installPath

          $bisonPath = Join-Path $installPath "win_bison.exe"
          $flexPath = Join-Path $installPath "win_flex.exe"
          & $bisonPath --version
          if ($LASTEXITCODE -ne 0) {
              throw "win_bison --version failed with exit code $LASTEXITCODE"
          }
          & $flexPath --version
          if ($LASTEXITCODE -ne 0) {
              throw "win_flex --version failed with exit code $LASTEXITCODE"
          }
        shell: pwsh

      - name: Restore OpenCppCoverage cache
        uses: actions/cache@v6
        with:
          path: C:\Program Files\OpenCppCoverage
          key: opencppcoverage-${{ runner.os }}-${{ env.OPENCPPCOVERAGE_VERSION }}

      - name: Install OpenCppCoverage
        run: |
          $maxRetry = 3
          $retryCount = 0
          $opencppPath = "C:\Program Files\OpenCppCoverage"
          $opencppExe = Join-Path $opencppPath "OpenCppCoverage.exe"
          $chocoLogPath = "C:\ProgramData\chocolatey\logs\chocolatey.log"
          if (Test-Path $opencppExe) {
              Write-Host "OpenCppCoverage cache restored; skipping install."
          } else {
              $installed = $false
              while (-not $installed -and $retryCount -lt $maxRetry) {
                  $retryCount++
                  Write-Host "choco install opencppcoverage $env:OPENCPPCOVERAGE_VERSION (attempt $retryCount/$maxRetry)..."
                  choco install opencppcoverage --version=$env:OPENCPPCOVERAGE_VERSION -y
                  $chocoExitCode = $LASTEXITCODE
                  $resolvedCommand = Get-Command OpenCppCoverage.exe -ErrorAction SilentlyContinue
                  if ((Test-Path $opencppExe) -or $null -ne $resolvedCommand) {
                      $installed = $true
                      Write-Host "OpenCppCoverage is available."
                  } elseif ($retryCount -lt $maxRetry) {
                      Write-Host "OpenCppCoverage is not available yet (choco exit code $chocoExitCode). Retrying in 10 seconds..."
                      Start-Sleep -Seconds 10
                  }
              }
              if (-not $installed) {
                  Write-Host "ERROR: choco install opencppcoverage failed after $maxRetry attempts."
                  if (Test-Path $chocoLogPath) {
                      Write-Host "Last 50 lines of ${chocoLogPath}:"
                      Get-Content $chocoLogPath -Tail 50
                  } else {
                      Write-Host "Chocolatey log not found at $chocoLogPath"
                  }
                  exit 1
              }
          }

          # PATH に追加 (GitHub Actions の永続化メカニズムを使用)
          $resolvedCommand = Get-Command OpenCppCoverage.exe -ErrorAction SilentlyContinue
          if (Test-Path $opencppExe) {
              $opencppBinPath = $opencppPath
              $opencppCommandPath = $opencppExe
          } elseif ($null -ne $resolvedCommand) {
              $opencppBinPath = Split-Path -Parent $resolvedCommand.Source
              $opencppCommandPath = $resolvedCommand.Source
          } else {
              $opencppBinPath = $null
              $opencppCommandPath = $null
          }
          if ($null -ne $opencppBinPath) {
              Write-Host "`nAdding OpenCppCoverage to PATH from $opencppBinPath..."
              Add-Content -Path $env:GITHUB_PATH -Value $opencppBinPath
              Write-Host "PATH addition completed."
          } else {
              Write-Host "ERROR: OpenCppCoverage executable not found after installation."
              exit 1
          }
          & $opencppCommandPath --help
          $opencppHelpExitCode = $LASTEXITCODE
          if ($opencppHelpExitCode -gt 1) {
              Write-Host "ERROR: OpenCppCoverage help failed with exit code $opencppHelpExitCode."
              exit $opencppHelpExitCode
          }
          $global:LASTEXITCODE = 0
        shell: pwsh

      - name: Restore ReportGenerator cache
        uses: actions/cache@v6
        with:
          path: ~/.dotnet/tools
          key: reportgenerator-${{ runner.os }}-${{ env.REPORTGENERATOR_VERSION }}

      - name: Install ReportGenerator
        run: |
          $dotnetToolsPath = Join-Path $env:USERPROFILE ".dotnet\tools"
          Add-Content -Path $env:GITHUB_PATH -Value $dotnetToolsPath
          $env:PATH = "$dotnetToolsPath;$env:PATH"

          $reportGeneratorExe = Join-Path $dotnetToolsPath "reportgenerator.exe"
          if (Test-Path $reportGeneratorExe) {
              Write-Host "ReportGenerator cache restored; skipping install."
          } else {
              dotnet tool install --global dotnet-reportgenerator-globaltool --version $env:REPORTGENERATOR_VERSION
          }

          reportgenerator -h
        shell: pwsh

      - name: Setup MSVC environment
        run: |
          & "${{ github.workspace }}\.github\scripts\Add-VSBT-Env-x64.ps1"
        shell: pwsh

      - name: Record make version
        run: make --version
        shell: pwsh

      - name: Make build log directory
        run: New-Item -ItemType Directory -Force -Path logs
        shell: pwsh

      - name: Build
        run: |
          set -o pipefail
          make 2>&1 | tee logs/windows-build.log
        shell: bash

      - name: Run tests
        run: |
          set -o pipefail
          make test 2>&1 | tee logs/windows-test.log
        shell: bash

      - name: Upload test results artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: |
            app/**/results/
            logs/windows-test.log
          if-no-files-found: warn

      - name: Upload build warnings
        uses: actions/upload-artifact@v7
        with:
          name: windows-warns
          path: |
            app/app_env.warn
            app/c_cpp_properties.warn
            app/**/prod/**/*.warn
            app/**/test/**/*.warn
          if-no-files-found: ignore

      - name: Upload build logs
        uses: actions/upload-artifact@v7
        with:
          name: windows-logs
          path: logs/windows-build.log
          if-no-files-found: warn

  publish-docs:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/framework/docsfw/.cache/puppeteer
    container:
      image: ghcr.io/hondarer/oracle-linux-container/oracle-linux-8-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        HOST_USER: user
        HOST_UID: 1001
        HOST_GID: 127
        TZ: Asia/Tokyo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 全履歴を取得 (git log 用: Markdown 処理時に author と date を取得するため)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize submodules (shallow)
        run: git submodule update --init --recursive --depth 1

      - name: Check NBSP
        run: python3 bin/check-nbsp.py --force

      - name: Load app environment
        run: bash bin/load-app-env.sh --env-file .vscode/.env.linux --workspace "$GITHUB_WORKSPACE" --format github

      - name: Restore docsfw npm and puppeteer cache
        uses: actions/cache@v6
        with:
          path: |
            framework/docsfw/bin/node_modules
            framework/docsfw/.cache/puppeteer
          key: docsfw-cache-ol8-${{ hashFiles('framework/docsfw/bin/package-lock.json') }}

      - name: Sync skills
        run: make skills

      - name: Generate and publish documentation
        run: make doxy && make docs

      - name: Create artifact archives
        run: |
          mkdir -p pages/artifacts
          # HTML ドキュメント (サブディレクトリごとに分割)
          if [ -d "pages/doxygen" ]; then
            zip -r pages/artifacts/docs-html-doxygen.zip pages/doxygen || true
          fi
          docs_warn_list=$(mktemp)
          {
            [ -f docs.warn ] && printf '%s\n' docs.warn
            find app -type f -name "doxy*.warn" | sort
          } > "$docs_warn_list"
          if [ -s "$docs_warn_list" ]; then
            zip -r pages/artifacts/docs-warns.zip -@ < "$docs_warn_list" || true
          fi
          rm -f "$docs_warn_list"
          find pages -type d -name html | while read -r html_dir; do
            label=$(echo "$html_dir" | sed 's|^pages/||;s|/html$||;s|/|-|g')
            zip -r "pages/artifacts/docs-html-${label}.zip" "$html_dir" || true
          done
          # DOCX ドキュメント (サブディレクトリごとに分割)
          find pages -type d -name docx | while read -r docx_dir; do
            label=$(echo "$docx_dir" | sed 's|^pages/||;s|/docx$||;s|/|-|g')
            zip -r "pages/artifacts/docs-docx-${label}.zip" "$docx_dir" || true
          done

      - name: Stage language-split documentation
        run: |
          set -euo pipefail
          stage_lang() {
            local lang="$1"
            local dest="staging/documentation-${lang}"
            mkdir -p "${dest}/artifacts"
            if [ -d "pages/${lang}" ]; then
              cp -a "pages/${lang}" "${dest}/"
            fi
            if [ -d "pages/${lang}-details" ]; then
              cp -a "pages/${lang}-details" "${dest}/"
            fi
            local zip
            for zip in \
              "pages/artifacts/docs-html-${lang}.zip" \
              "pages/artifacts/docs-html-${lang}-details.zip" \
              "pages/artifacts/docs-docx-${lang}.zip" \
              "pages/artifacts/docs-docx-${lang}-details.zip"
            do
              if [ -f "${zip}" ]; then
                cp -a "${zip}" "${dest}/artifacts/"
              fi
            done
          }
          stage_lang ja
          stage_lang en
          mkdir -p staging/documentation-doxygen/artifacts
          if [ -d pages/doxygen ]; then
            cp -a pages/doxygen staging/documentation-doxygen/
          fi
          if [ -f pages/artifacts/docs-html-doxygen.zip ]; then
            cp -a pages/artifacts/docs-html-doxygen.zip staging/documentation-doxygen/artifacts/
          fi
          if [ -f pages/artifacts/docs-warns.zip ]; then
            cp -a pages/artifacts/docs-warns.zip staging/documentation-doxygen/artifacts/
          fi

      - name: Upload Japanese documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-ja
          path: staging/documentation-ja/
          if-no-files-found: warn

      - name: Upload English documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-en
          path: staging/documentation-en/
          if-no-files-found: warn

      - name: Upload Doxygen documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-doxygen
          path: staging/documentation-doxygen/
          if-no-files-found: warn

      - name: Upload documentation warnings
        uses: actions/upload-artifact@v7
        with:
          name: docs-warns
          path: |
            docs.warn
            app/**/doxy*.warn
          if-no-files-found: ignore

      - name: Upload html artifacts (doxygen)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-docs-html-doxygen-${{ github.sha }}
          path: pages/doxygen/
          if-no-files-found: warn

      - name: Upload html artifacts (ja)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-docs-html-ja-${{ github.sha }}
          path: pages/ja/html/
          if-no-files-found: warn

      - name: Upload html artifacts (en)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-docs-html-en-${{ github.sha }}
          path: pages/en/html/
          if-no-files-found: warn

      - name: Upload html artifacts (ja-details)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-docs-html-ja-details-${{ github.sha }}
          path: pages/ja-details/html/
          if-no-files-found: warn

      - name: Upload html artifacts (en-details)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-docs-html-en-details-${{ github.sha }}
          path: pages/en-details/html/
          if-no-files-found: warn

      - name: Upload docx artifacts (ja)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-docs-docx-ja-${{ github.sha }}
          path: pages/ja/docx/
          if-no-files-found: warn

      - name: Upload docx artifacts (en)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-docs-docx-en-${{ github.sha }}
          path: pages/en/docx/
          if-no-files-found: warn

      - name: Upload docx artifacts (ja-details)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-docs-docx-ja-details-${{ github.sha }}
          path: pages/ja-details/docx/
          if-no-files-found: warn

      - name: Upload docx artifacts (en-details)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-docs-docx-en-details-${{ github.sha }}
          path: pages/en-details/docx/
          if-no-files-found: warn

  warnings-summary:
    runs-on: ubuntu-latest
    needs: [build-and-test-linux, build-and-test-windows, publish-docs]
    if: ${{ always() }}

    steps:
      - name: Summarize warning artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const trackedArtifacts = [
              'linux-ol8-warns',
              'linux-ol9-warns',
              'linux-ol10-warns',
              'windows-warns',
              'docs-warns',
            ];

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              }
            );

            const artifactNames = new Set(artifacts.map((artifact) => artifact.name));
            const detectedNames = trackedArtifacts.filter((artifactName) => artifactNames.has(artifactName));

            core.info(`Artifacts in run: ${Array.from(artifactNames).sort().join(', ')}`);

            if (detectedNames.length > 0) {
              core.warning(`Warning artifacts detected: ${detectedNames.join(', ')}`);

              const list = detectedNames
                .map((artifactName) => `- \`${artifactName}\``)
                .join('\n');

              await core.summary
                .addHeading('Warning artifacts detected', 2)
                .addRaw('The workflow completed and warning artifacts were uploaded.\n\n')
                .addRaw(`${list}\n\n`)
                .addRaw('Review the Artifacts section of this run for details.\n')
                .write();
            } else {
              await core.summary
                .addHeading('Warning artifacts', 2)
                .addRaw('No warning artifacts were uploaded in this run.\n')
                .write();
            }

  deploy-pages:
    needs: [build-and-test-linux, build-and-test-windows, publish-docs]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # index.html のタイトルを .vscode/pub_markdown.config.yaml から解決するため、
      # このジョブでも bin/ と .vscode/ を取得する。
      # checkout は作業ディレクトリを掃除するため、アーティファクトの取得より前に置く。
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          sparse-checkout: |
            bin
            .vscode

      - name: Download Linux OL8 test results
        uses: actions/download-artifact@v8
        with:
          name: linux-ol8-test-results
          path: test-results/linux-ol8

      - name: Download Linux OL9 test results
        uses: actions/download-artifact@v8
        with:
          name: linux-ol9-test-results
          path: test-results/linux-ol9

      - name: Download Linux OL10 test results
        uses: actions/download-artifact@v8
        with:
          name: linux-ol10-test-results
          path: test-results/linux-ol10

      - name: Download Windows test results
        uses: actions/download-artifact@v8
        with:
          name: windows-test-results
          path: test-results/windows

      - name: Download documentation
        uses: actions/download-artifact@v8
        with:
          pattern: documentation-*
          merge-multiple: true
          path: pages

      - name: Download Linux OL8 logs
        uses: actions/download-artifact@v8
        with:
          name: linux-ol8-logs
          path: logs/linux-ol8

      - name: Download Linux OL9 logs
        uses: actions/download-artifact@v8
        with:
          name: linux-ol9-logs
          path: logs/linux-ol9

      - name: Download Linux OL10 logs
        uses: actions/download-artifact@v8
        with:
          name: linux-ol10-logs
          path: logs/linux-ol10

      - name: Download Windows logs
        uses: actions/download-artifact@v8
        with:
          name: windows-logs
          path: logs/windows

      - name: Detect optional build warning artifacts
        id: warning_artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              }
            );
            const artifactNames = new Set(artifacts.map((artifact) => artifact.name));
            core.info(`Artifacts in run: ${Array.from(artifactNames).sort().join(', ')}`);
            core.setOutput('linux_ol8', String(artifactNames.has('linux-ol8-warns')));
            core.setOutput('linux_ol9', String(artifactNames.has('linux-ol9-warns')));
            core.setOutput('linux_ol10', String(artifactNames.has('linux-ol10-warns')));
            core.setOutput('windows', String(artifactNames.has('windows-warns')));

      - name: Download Linux OL8 build warnings
        if: steps.warning_artifacts.outputs.linux_ol8 == 'true'
        uses: actions/download-artifact@v8
        with:
          name: linux-ol8-warns
          path: warns/linux-ol8

      - name: Download Linux OL9 build warnings
        if: steps.warning_artifacts.outputs.linux_ol9 == 'true'
        uses: actions/download-artifact@v8
        with:
          name: linux-ol9-warns
          path: warns/linux-ol9

      - name: Download Linux OL10 build warnings
        if: steps.warning_artifacts.outputs.linux_ol10 == 'true'
        uses: actions/download-artifact@v8
        with:
          name: linux-ol10-warns
          path: warns/linux-ol10

      - name: Download Windows build warnings
        if: steps.warning_artifacts.outputs.windows == 'true'
        uses: actions/download-artifact@v8
        with:
          name: windows-warns
          path: warns/windows

      - name: Organize artifacts for Pages
        run: |
          # テスト結果とビルドログをアーカイブ化
          mkdir -p pages/artifacts

          if [ -d "test-results/linux-ol8" ]; then
            zip -r pages/artifacts/linux-ol8-test-results.zip test-results/linux-ol8
            echo "Created linux-ol8-test-results.zip"
          fi

          if [ -d "test-results/linux-ol9" ]; then
            zip -r pages/artifacts/linux-ol9-test-results.zip test-results/linux-ol9
            echo "Created linux-ol9-test-results.zip"
          fi

          if [ -d "test-results/linux-ol10" ]; then
            zip -r pages/artifacts/linux-ol10-test-results.zip test-results/linux-ol10
            echo "Created linux-ol10-test-results.zip"
          fi

          if [ -d "test-results/windows" ]; then
            zip -r pages/artifacts/windows-test-results.zip test-results/windows
            echo "Created windows-test-results.zip"
          fi

          if [ -d "logs/linux-ol8" ]; then
            zip -r pages/artifacts/linux-ol8-logs.zip logs/linux-ol8
            echo "Created linux-ol8-logs.zip"
          fi

          if [ -d "logs/linux-ol9" ]; then
            zip -r pages/artifacts/linux-ol9-logs.zip logs/linux-ol9
            echo "Created linux-ol9-logs.zip"
          fi

          if [ -d "logs/linux-ol10" ]; then
            zip -r pages/artifacts/linux-ol10-logs.zip logs/linux-ol10
            echo "Created linux-ol10-logs.zip"
          fi

          if [ -d "logs/windows" ]; then
            zip -r pages/artifacts/windows-logs.zip logs/windows
            echo "Created windows-logs.zip"
          fi

          # ビルド警告を ZIP 化して pages/artifacts/ に配置し、元ディレクトリを削除
          for os in linux-ol8 linux-ol9 linux-ol10 windows; do
            if [ -d "warns/${os}" ]; then
              zip -r "pages/artifacts/${os}-warns.zip" "warns/${os}"
              rm -rf "warns/${os}"
              echo "Created ${os}-warns.zip"
            fi
          done

          # ディレクトリ構造を確認
          echo "=== Pages directory structure ==="
          find pages -type f | head -20
          echo "..."

      - name: Create Pages root index.html
        run: |
          SITE_NAME="$(bash bin/resolve-site-name.sh --workspace "$GITHUB_WORKSPACE")"
          {
            cat <<INDEX_TOP
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>${SITE_NAME} ドキュメント</title>
            <style>
              body { font-family: sans-serif; max-width: 900px; margin: 2em auto; padding: 0 1em; }
              h1 { border-bottom: 2px solid #333; padding-bottom: 0.3em; }
              h2 { border-bottom: 1px solid #ccc; margin-top: 1.5em; }
              table { border-collapse: collapse; width: 100%; }
              th, td { text-align: left; padding: 0.4em 0.8em; border: 1px solid #ddd; }
              th { background: #f6f8fa; font-weight: normal; }
              a { color: #0366d6; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>${SITE_NAME} ドキュメント</h1>
          INDEX_TOP

            # Doxygen サブフォルダを自動探索してリンク生成
            if [ -d "./pages/doxygen" ] && \
               find ./pages/doxygen -maxdepth 1 -mindepth 1 -type d | grep -q .; then
              echo '  <h2>Doxygen ドキュメント</h2>'
              echo '  <table>'
              echo '    <tr><th>モジュール</th><th>リンク</th></tr>'
              find ./pages/doxygen -maxdepth 1 -mindepth 1 -type d | sort | while read -r subdir; do
                name=$(basename "$subdir")
                echo "    <tr><td>${name}</td><td><a href=\"doxygen/${name}/index.html\">${name} リファレンス</a></td></tr>"
              done
              echo '  </table>'
            fi

            # Markdown ドキュメント
            if find ./pages -maxdepth 2 -name html -type d | grep -q .; then
              cat <<'LANG_TABLE'
            <h2>Markdown ドキュメント</h2>
            <table>
              <tr><th>言語</th><th>種別</th><th>リンク</th></tr>
              <tr><td>日本語</td><td>通常版</td><td><a href="ja/html/index.html">日本語ドキュメント</a></td></tr>
              <tr><td>English</td><td>Standard</td><td><a href="en/html/index.html">English Documentation</a></td></tr>
              <tr><td>日本語</td><td>詳細版</td><td><a href="ja-details/html/index.html">日本語ドキュメント (詳細)</a></td></tr>
              <tr><td>English</td><td>Details</td><td><a href="en-details/html/index.html">English Documentation (Details)</a></td></tr>
            </table>
          LANG_TABLE
            fi

            # アーティファクト (存在するものを列挙)
            if [ -d "./pages/artifacts" ] && \
               find ./pages/artifacts -name "*.zip" ! -name "*-warns.zip" | grep -q .; then
              echo '  <h2>アーティファクト</h2>'
              echo '  <table>'
              echo '    <tr><th>ファイル名</th></tr>'
              find ./pages/artifacts -name "*.zip" ! -name "*-warns.zip" | sort | while read -r zipfile; do
                fname=$(basename "$zipfile")
                echo "    <tr><td><a href=\"artifacts/${fname}\">${fname}</a></td></tr>"
              done
              echo '  </table>'
            fi

            # ビルド・ドキュメント警告詳細 (存在する場合のみ列挙)
            if [ -d "./pages/artifacts" ] && \
               find ./pages/artifacts -name "*-warns.zip" | grep -q .; then
              echo '  <h2>ビルド・ドキュメント警告詳細</h2>'
              echo '  <table>'
              echo '    <tr><th>ファイル名</th></tr>'
              find ./pages/artifacts -name "*-warns.zip" | sort | while read -r zipfile; do
                fname=$(basename "$zipfile")
                echo "    <tr><td><a href=\"artifacts/${fname}\">${fname}</a></td></tr>"
              done
              echo '  </table>'
            fi

            cat <<'INDEX_BOTTOM'
          </body>
          </html>
          INDEX_BOTTOM
          } > ./pages/index.html

      - name: Drop uncompressed docx from Pages payload
        run: |
          # GitHub Pages の artifact 上限は 1 GB。
          # DOCX は index.html からディレクトリ参照せず、artifacts/*.zip で配布する。
          rm -rf pages/ja/docx pages/en/docx pages/ja-details/docx pages/en-details/docx
          echo "=== Pages payload after dropping uncompressed docx ==="
          du -sh pages pages/* pages/artifacts 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
